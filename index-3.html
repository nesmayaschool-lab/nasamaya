  <h1>دروس أونلاين تفاعلية لكل المراحل</h1>
  <p>حصص مباشرة، اختبارات ومراجعات شهرية، وأسئلة تفاعلية — للمرحلتين الابتدائية والإعدادية.</p>

<div class="wrap" id="dashboardArea">جارِ التحميل...</div>

<section class="wrap">
  <h2 class="section-title">الاشتراك</h2>
  <a href="subscribe.html" class="card" style="max-width:320px">
    <h3>اشترك الآن</h3>
    <div class="meta">ادفع عبر فودافون كاش واحصل على تفعيل المادة</div>
  </a>
</section>

<footer class="wrap">منصة نسماية</footer>

<script src="app.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function subjectCardsHtml(stage, grade){
  const subs = CURRICULUM[stage][grade] || [];
  let html = '';
  subs.forEach(key=>{
    html += `<a href="subject-live.html?subject=${key}" class="card">
      <h3>${SUBJECT_LABELS[key]}</h3>
      <div class="meta">البث المباشر · الاختبارات والمراجعات</div>
    </a>`;
  });
  return html || '<p class="small-note">لا توجد مواد لهذا الصف بعد.</p>';
}

auth.onAuthStateChanged(async (user)=>{
  const headerAuth = document.getElementById('headerAuth');
  const area = document.getElementById('dashboardArea');
  if(!user){
    headerAuth.innerHTML = `<a href="login.html" class="btn" style="padding:8px 18px;font-size:.9em">تسجيل الدخول / حساب جديد</a>`;
    area.innerHTML = `
      <h2 class="section-title">التعليم الابتدائي</h2>
      <p class="small-note">6 صفوف من الأول حتى السادس — سجّل دخولك لتشوف موادك.</p>
      <h2 class="section-title">التعليم الإعدادي</h2>
      <p class="small-note">3 صفوف من الأول حتى الثالث — سجّل دخولك لتشوف موادك.</p>
      <div class="quiz-box" style="text-align:center;margin-top:10px">
        <p>سجّل دخولك أو اعمل حساب جديد لتشوف مواد صفّك وتدخل حصصك.</p>
        <a class="btn" href="login.html">تسجيل الدخول / حساب جديد</a>
      </div>`;
    return;
  }
  headerAuth.innerHTML = `<button class="btn" style="padding:8px 18px;font-size:.9em;background:#888" onclick="firebase.auth().signOut().then(()=>location.reload())">تسجيل الخروج</button>`;
  const doc = await db.collection('students').doc(user.uid).get();
  if(!doc.exists){ area.innerHTML = '<p>حدث خطأ في بيانات حسابك.</p>'; return; }
  const student = doc.data();
  const isAdmin = user.email === "nesmayaschool@gmail.com";
  let html = `<h2 class="section-title">موادك — ${GRADE_LABELS[student.stage][student.grade]}</h2>
    <div class="grid">${subjectCardsHtml(student.stage, student.grade)}</div>`;
  if(isAdmin){
    html += `<h2 class="section-title" style="margin-top:30px">تصفّح كأدمن</h2>
      <div class="row2" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <select id="browseStage" onchange="updateBrowseGrades()" style="max-width:220px"></select>
        <select id="browseGrade" onchange="renderBrowseSubjects()" style="max-width:220px"></select>
      </div>
      <div class="grid" id="browseGrid"></div>`;
  }
  area.innerHTML = html;
  if(isAdmin){
    const stageSel = document.getElementById('browseStage');
    Object.keys(STAGE_LABELS).forEach(s=>{
      const o = document.createElement('option'); o.value = s; o.textContent = STAGE_LABELS[s]; stageSel.appendChild(o);
    });
    updateBrowseGrades();
  }
});

function updateBrowseGrades(){
  const stage = document.getElementById('browseStage').value;
  const gradeSel = document.getElementById('browseGrade');
  gradeSel.innerHTML = '';
  Object.keys(GRADE_LABELS[stage]).forEach(g=>{
    const o = document.createElement('option'); o.value = g; o.textContent = GRADE_LABELS[stage][g]; gradeSel.appendChild(o);
  });
  renderBrowseSubjects();
}
function renderBrowseSubjects(){
  const stage = document.getElementById('browseStage').value;
  const grade = document.getElementById('browseGrade').value;
  document.getElementById('browseGrid').innerHTML = subjectCardsHtml(stage, grade);
}
</script>
</body>
</html>

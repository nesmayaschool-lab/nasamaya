<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إعدادات الموقع - منصة نسماية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.card2{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.crow input[type=color]{width:64px;height:40px;padding:2px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.wbox label{display:block;margin:8px 0 4px;font-weight:700}
.wbox input[type=text],.wbox textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font-family:inherit;margin-bottom:6px;background:var(--card);color:var(--ink)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<header><div class="wrap"><a href="index.html" class="brand">🍃 منصة نسماية</a></div></header>
<div class="wrap">
  <h1>إعدادات الموقع</h1>
  <p class="small-note">رسالة الترحيب والألوان بتظهر لكل الزوار بعد الحفظ. الطالب يقدر يغيّر مظهره لنفسه من زرار 🎨 في أسفل الصفحة.</p>
  <div id="area">جارِ التحقق من الدخول...</div>
</div>
<footer class="wrap">منصة نسماية</footer>

<script>
const ADMIN_EMAIL = "nesmayaschool@gmail.com";
const DEFAULTS = {paper:'#F6F1E4', ink:'#1E2A22', pine:'#26433A', gold:'#C98A3B', card:'#FFFFFF'};
const DEFAULT_WELCOME = {
  title: 'أهلاً بك في منصة نسماية 🌿',
  text: 'دروس أونلاين مباشرة للمرحلتين الابتدائية والإعدادية، مع مراجعات واختبارات وأسئلة تفاعلية. سجّل حسابك واشترك وابدأ رحلتك معنا.',
  signupText: 'أنت دلوقتي جزء من أسرة منصة نسماية. نتمنى لك رحلة تعليمية ممتعة ومفيدة.'
};
const LABELS = {
  paper:'لون خلفية الصفحة',
  ink:'لون النص',
  pine:'اللون الأساسي (العناوين والتبويبات)',
  gold:'لون الأزرار',
  card:'لون البطاقات'
};
const PRESETS = [
  {name:'الأصلي', c:DEFAULTS},
  {name:'أخضر فاتح', c:{paper:'#F1F8F2', ink:'#17301F', pine:'#2E7D4F', gold:'#E8B04B', card:'#FFFFFF'}},
  {name:'أزرق', c:{paper:'#EEF5FB', ink:'#14283A', pine:'#1B5E9B', gold:'#F2A93B', card:'#FFFFFF'}},
  {name:'وردي', c:{paper:'#FDF1F5', ink:'#3A1A27', pine:'#B83B73', gold:'#F4B942', card:'#FFFFFF'}},
  {name:'بنفسجي', c:{paper:'#F5F1FB', ink:'#241A3A', pine:'#6A3FB5', gold:'#F0B34A', card:'#FFFFFF'}},
  {name:'داكن', c:{paper:'#14201A', ink:'#EAE6DA', pine:'#8FD3B4', gold:'#E0A84F', card:'#1D2D26'}}
];

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let current = Object.assign({}, DEFAULTS);
let welcome = Object.assign({}, DEFAULT_WELCOME);

function mix(a, b, p){
  const h = x => [1,3,5].map(i => parseInt(x.substr(i,2),16));
  const A = h(a), B = h(b);
  return '#' + A.map((v,i)=>('0' + Math.round(v*p + B[i]*(1-p)).toString(16)).slice(-2)).join('');
}
function toVars(c){
  return {
    'paper': c.paper, 'ink': c.ink, 'card': c.card,
    'pine': c.pine, 'pine-dark': mix(c.pine, '#000000', 0.55),
    'gold': c.gold, 'gold-soft': mix(c.gold, '#ffffff', 0.55),
    'line': mix(c.ink, c.paper, 0.16)
  };
}
function preview(){
  const v = toVars(current);
  Object.keys(v).forEach(k => document.documentElement.style.setProperty('--' + k, v[k]));
}

auth.onAuthStateChanged(async (user)=>{
  const area = document.getElementById('area');
  if(!user){
    area.innerHTML = '<p>لازم تسجّل دخول أولاً بحساب الأدمن.</p><a class="btn" href="login.html?next=admin-settings.html">تسجيل الدخول</a>';
    return;
  }
  if(user.email !== ADMIN_EMAIL){
    area.innerHTML = '<p>هذا الحساب غير مصرح له بالدخول لهذه الصفحة.</p>';
    return;
  }
  try{
    const doc = await db.collection('settings').doc('site').get();
    if(doc.exists){
      const d = doc.data();
      if(d.colors) current = Object.assign({}, DEFAULTS, d.colors);
      if(d.welcome) welcome = Object.assign({}, DEFAULT_WELCOME, d.welcome);
    }
  }catch(e){}
  renderForm();
  preview();
});

  const presetBtns = PRESETS.map((p,i)=>`<button class="tab" onclick="applyPreset(${i})">${p.name}</button>`).join('');
  const rows = Object.keys(LABELS).map(k=>`<div class="crow"><label>${LABELS[k]}</label>
      <input type="color" id="c-${k}" value="${current[k]}" oninput="setColor('${k}', this.value)"></div>`).join('');
  area.innerHTML = `
    <div class="card2 wbox">
      <strong>رسالة الترحيب</strong>
      <label for="w-title">عنوان الترحيب في الصفحة الرئيسية</label>
      <input type="text" id="w-title" maxlength="120">
      <label for="w-text">نص الترحيب في الصفحة الرئيسية</label>
      <textarea id="w-text" rows="4" maxlength="400"></textarea>
      <label for="w-signup">رسالة الترحيب بعد إنشاء الحساب</label>
      <textarea id="w-signup" rows="3" maxlength="400"></textarea>
      <button class="btn" onclick="saveWelcome()">حفظ الترحيب</button>
      <button class="btn" style="background:transparent;border:2px solid var(--pine);color:var(--pine);margin-right:8px" onclick="fillWelcome(DEFAULT_WELCOME)">النص الأصلي</button>
      <div class="small-note" id="wmsg"></div>
    </div>
    <div class="card2">
      <strong>ألوان جاهزة</strong>
      <div class="presets" style="margin-top:8px">${presetBtns}</div>
    </div>
    <div class="card2">
      <strong>تخصيص الألوان</strong>
      <div style="margin-top:10px">${rows}</div>
    </div>

      <strong>معاينة</strong>
      <div cla
